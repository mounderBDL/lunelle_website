spring:
  application:
    name: lunelle-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

app:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 12
  # Where the real customer IP comes from, for the per-IP limits (login, order lookup, checkout).
  # Leave the header empty until the site runs behind its HTTPS proxy: the per-IP limits then stay off.
  #   Cloudflare:     CLIENT_IP_HEADER=CF-Connecting-IP  (and let only Cloudflare reach the server)
  #   nginx / Caddy:  CLIENT_IP_HEADER=X-Real-IP         (the proxy must OVERWRITE it with the peer address)
  # Next.js must not be reachable directly from the internet, or clients could set the header themselves.
  # trusted-proxies = the address(es) the Next.js server calls this backend from.
  client-ip:
    header: ${CLIENT_IP_HEADER:}
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
  cookie:
    name: lunelle_admin
    secure: false   # must be true in production (HTTPS)
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    
  yalidine:
    api-id: ${YALIDINE_API_ID:}
    api-token: ${YALIDINE_API_TOKEN:}
    from-wilaya: ${YALIDINE_FROM_WILAYA:}
    base-url: ${YALIDINE_BASE_URL:https://api.yalidine.app/v1}
